
name: Ubuntu 26.04, R 4.7, libc++
on:
  workflow_dispatch:
  schedule:
    - cron:  '33 17 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    container: ghcr.io/r-hub/containers/clang23:latest
    steps:
    - name: Check Distro and R version
      run: |
        #
        readRenviron("/etc/os-release")
        if (Sys.getenv("ID") != "ubuntu") stop("Not Ubuntu")
        if (Sys.getenv("VERSION_ID") != "26.04") stop("Not Ubuntu 26.04")
        if (getRversion() < "4.7.0" || getRversion() >= "4.8.0") {
          stop("Not R 4.7.x")
        }
      shell: Rscript {0}
    - uses: actions/checkout@v4
    - uses: r-hub/repos/actions/update-repo@main
      with:
        directory: ubuntu-26.04/4.7/libc++
        token: ${{ secrets.CRANATGH_GITHUB_TOKEN }}
      env:
        PKG_CURRENT_PLATFORM: x86_64-pc-linux-gnu-ubuntu-26.04-libc++
