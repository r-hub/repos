name: Ubuntu 26.04 aarch64, R 4.7
on:
  workflow_dispatch:
  schedule:
    - cron:  '53 17 * * *'

jobs:
  update:
    runs-on: ubuntu-24.04-arm
    container: ghcr.io/r-lib/rig/ubuntu-26.04-devel
    steps:
    - name: Check Distro and R version
      run: |
        #
        readRenviron("/etc/os-release")
        if (Sys.getenv("ID") != "ubuntu") stop("Not Ubuntu")
        if (Sys.getenv("VERSION_ID") != "26.04") stop("Not Ubuntu 26.04")
        if (getRversion() < "4.7.0" || getRversion() >= "4.8.0") {
          stop("Not R 4.7.x")
        }
        if (Sys.info()[["machine"]] != "aarch64") stop("Not aarch64")
      shell: Rscript {0}
    - uses: actions/checkout@v4
    - uses: r-hub/repos/actions/update-repo@main
      with:
        directory: ubuntu-26.04-aarch64/4.7
        token: ${{ secrets.CRANATGH_GITHUB_TOKEN }}
